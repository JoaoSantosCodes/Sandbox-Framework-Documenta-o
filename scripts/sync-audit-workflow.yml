# Sync Audit (mitigador C2) — Vault (espelho) ↔ site publicado
#
# Audita divergências entre o Vault e o repositório do site a cada push na main
# e duas vezes por semana (seg/qui 09:00 UTC). O Vault real vive no Windows local;
# o CI usa um repositório espelho de leitura configurado no segredo
# VAULT_MIRROR_REPO (formato "owner/repo", ex.: JoaoSantosCodes/Sandbox-Framework-Vault).
# Sem o segredo, o job roda apenas contra o Vault padrão embutido (fallback limitado
# ao conteúdo commitado em scripts/vault-mirror/) e reporta o aviso.

name: sync-audit (Vault mirror)

on:
  push:
    branches: [main]
  schedule:
    - cron: "0 9 * * 1,4"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: baixar espelho do Vault
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          REPO="${{ secrets.VAULT_MIRROR_REPO }}"
          if [ -n "$REPO" ]; then
            git clone --depth 1 "https://x-access-token:${GH_TOKEN}@github.com/${REPO}.git" vault-mirror 2>/dev/null \
              || echo "AVISO: espelho ${REPO} inacessível — auditoria limitada"
          else
            echo "AVISO: segredo VAULT_MIRROR_REPO não definido — auditoria limitada"
          fi

      - name: auditar Vault ↔ site
        run: |
          VAULT="${PWD}/vault-mirror"
          [ -d "$VAULT" ] || VAULT="${PWD}/scripts/vault-mirror"
          python3 scripts/sync-audit.py --vault "$VAULT" --fail-on-diff
